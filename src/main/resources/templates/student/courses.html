<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main-content})}">
<head><title>Browse Courses - Eilmuz</title></head>
<body>
<th:block th:fragment="main-content">
<h2 class="mb-4"><i class="bi bi-collection-play me-2"></i>Browse Courses</h2>
<div th:if="${#lists.isEmpty(courses)}" class="alert alert-info">No courses available yet.</div>
<div class="row">
    <div class="col-md-4 mb-4" th:each="course : ${courses}">
        <div class="card h-100 shadow-sm">
            <img th:if="${course.thumbnailPath != null}"
                 th:src="@{'/uploads/' + ${course.thumbnailPath}}"
                 class="card-img-top" style="height:160px;object-fit:cover;" alt="thumbnail">
            <div class="card-img-top bg-secondary text-white d-flex align-items-center justify-content-center"
                 th:unless="${course.thumbnailPath != null}" style="height:160px;">
                <i class="bi bi-play-circle fs-1"></i>
            </div>
            <div class="card-body d-flex flex-column">
                <h5 class="card-title" th:text="${course.title}"></h5>
                <p class="card-text text-muted small flex-grow-1" th:text="${course.description}"></p>
                <p class="text-muted small"><i class="bi bi-person me-1"></i><span th:text="${course.instructor.firstName + ' ' + course.instructor.lastName}"></span></p>
                <div class="mt-auto">
                    <a th:href="@{'/student/courses/' + ${course.id}}" class="btn btn-outline-primary btn-sm me-2">View</a>
                    <form th:if="${!enrolledMap[course.id]}" th:action="@{'/student/courses/' + ${course.id} + '/enroll'}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-primary btn-sm">Enroll</button>
                    </form>
                    <span th:if="${enrolledMap[course.id]}" class="badge bg-success">Enrolled</span>
                </div>
            </div>
        </div>
    </div>
</div>
</th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main-content})}">
<head><title th:text="${course.title + ' - Eilmuz'}">Course</title></head>
<body>
<th:block th:fragment="main-content">
<div th:if="${param.notEnrolled}" class="alert alert-warning">Please enroll in this course to watch videos.</div>
<div class="row">
    <div class="col-md-8">
        <h2 th:text="${course.title}"></h2>
        <p class="text-muted"><i class="bi bi-person me-1"></i><span th:text="${course.instructor.firstName + ' ' + course.instructor.lastName}"></span></p>
        <p th:text="${course.description}"></p>
    </div>
    <div class="col-md-4">
        <div class="card">
            <img th:if="${course.thumbnailPath != null}"
                 th:src="@{'/uploads/' + ${course.thumbnailPath}}"
                 class="card-img-top" alt="thumbnail">
            <div class="card-body text-center">
                <div th:if="!${enrolled}">
                    <p class="text-muted">Enroll to access all lessons</p>
                    <form th:action="@{'/student/courses/' + ${course.id} + '/enroll'}" method="post">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-circle me-1"></i>Enroll Now</button>
                    </form>
                </div>
                <div th:if="${enrolled}">
                    <span class="badge bg-success fs-6"><i class="bi bi-check-circle me-1"></i>Enrolled</span>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:if="${enrolled}" class="mt-4">
    <h4><i class="bi bi-list-ol me-2"></i>Lessons</h4>
    <div th:if="${#lists.isEmpty(lessons)}" class="alert alert-info">No lessons added yet.</div>
    <div class="list-group">
        <a th:each="lesson, stat : ${lessons}"
           th:href="@{'/video/watch/' + ${lesson.id}}"
           class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
            <span>
                <span class="badge bg-primary me-2" th:text="${stat.count}"></span>
                <span th:text="${lesson.title}"></span>
            </span>
            <i class="bi bi-play-circle-fill text-primary"></i>
        </a>
    </div>
</div>
</th:block>
</body>
</html>

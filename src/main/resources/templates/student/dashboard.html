<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main-content})}">
<head><title>Student Dashboard - Eilmuz</title></head>
<body>
<th:block th:fragment="main-content">
<h2 class="mb-4"><i class="bi bi-person-video3 me-2"></i>Xush kelibsiz, <span th:text="${student.firstName}"></span>!</h2>
<h4 class="mb-3"><i class="bi bi-book me-2"></i>Yozilgan kurslarim</h4>
<div th:if="${#lists.isEmpty(enrollments)}" class="alert alert-info">Siz hali hech qaysi kursga yozilmagansiz. <a th:href="@{/student/courses}">Kurslarni ko'rish</a></div>
<div class="row">
<div class="col-md-4 mb-3" th:each="enrollment : ${enrollments}">
        <div class="card h-100">
            <img th:if="${enrollment.course.thumbnailPath != null}"
                 th:src="@{'/uploads/' + ${enrollment.course.thumbnailPath}}"
                 class="card-img-top" style="height:150px;object-fit:cover;" alt="thumbnail">
            <div class="card-body">
                <h6 class="card-title" th:text="${enrollment.course.title}"></h6>
                <p class="text-muted small" th:text="${enrollment.course.instructor.firstName + ' ' + enrollment.course.instructor.lastName}"></p>
                <p class="small text-secondary mb-2">
                    <i class="bi bi-play-circle me-1"></i>
                    <span th:text="${lessonCountMap[enrollment.course.id] + ' ta video dars'}">0 ta video dars</span>
                </p>
                <a th:href="@{'/student/courses/' + ${enrollment.course.id}}" class="btn btn-sm btn-primary">
                    <i class="bi bi-play-circle-fill me-1"></i>O'qishni davom ettirish
                </a>
            </div>
        </div>
    </div>
</div>
<hr>
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Available Courses</h4>
    <a th:href="@{/student/courses}" class="btn btn-outline-primary btn-sm">Browse All</a>
</div>
<div class="row">
<div class="col-md-4 mb-3" th:each="course : ${approvedCourses}">
        <div class="card h-100">
            <img th:if="${course.thumbnailPath != null}"
                 th:src="@{'/uploads/' + ${course.thumbnailPath}}"
                 class="card-img-top" style="height:150px;object-fit:cover;" alt="thumbnail">
            <div class="card-body">
                <h6 class="card-title" th:text="${course.title}"></h6>
                <p class="text-muted small" th:text="${course.instructor.firstName + ' ' + course.instructor.lastName}"></p>
                <a th:href="@{'/student/courses/' + ${course.id}}" class="btn btn-sm btn-outline-primary">View Course</a>
            </div>
        </div>
    </div>
</div>
</th:block>
</body>
</html>

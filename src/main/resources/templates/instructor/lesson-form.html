<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main-content})}">
<head><title>Add Lesson - Eilmuz</title></head>
<body>
<th:block th:fragment="main-content">
<h2 class="mb-4"><i class="bi bi-camera-video me-2"></i>Add Lesson to: <span th:text="${course.title}" class="text-primary"></span></h2>
<div class="card shadow-sm">
    <div class="card-body p-4">
        <form th:action="@{'/instructor/courses/' + ${course.id} + '/lessons'}" method="post"
              th:object="${lessonDto}" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label fw-bold">Lesson Title *</label>
                <input type="text" th:field="*{title}" class="form-control" required>
                <div class="text-danger small" th:errors="*{title}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Order Number</label>
                <input type="number" th:field="*{orderNum}" class="form-control" min="0">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Video File</label>
                <input type="file" th:field="*{videoFile}" class="form-control" accept="video/*">
                <small class="text-muted">Supported: MP4, WebM, OGG (max 500MB)</small>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Upload Lesson</button>
                <a th:href="@{/instructor/dashboard}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</th:block>
</body>
</html>

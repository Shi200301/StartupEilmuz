<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main-content})}">
<head><title>Create Course - Eilmuz</title></head>
<body>
<th:block th:fragment="main-content">
<h2 class="mb-4"><i class="bi bi-plus-circle me-2"></i>Create New Course</h2>
<div class="card shadow-sm">
    <div class="card-body p-4">
        <form th:action="@{/instructor/courses}" method="post" th:object="${courseDto}" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label fw-bold">Course Title *</label>
                <input type="text" th:field="*{title}" class="form-control" required>
                <div class="text-danger small" th:errors="*{title}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Thumbnail Image</label>
                <input type="file" th:field="*{thumbnail}" class="form-control" accept="image/*">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Create Course</button>
                <a th:href="@{/instructor/dashboard}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</th:block>
</body>
</html>

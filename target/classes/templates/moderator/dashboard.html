<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main-content})}">
<head><title>Moderator Dashboard - Eilmuz</title></head>
<body>
<th:block th:fragment="main-content">
<h2 class="mb-4"><i class="bi bi-shield-check me-2"></i>Course Review</h2>
<div th:if="${param.approved}" class="alert alert-success">Course approved successfully!</div>
<div th:if="${param.rejected}" class="alert alert-warning">Course rejected.</div>
<div th:if="${#lists.isEmpty(pendingCourses)}" class="alert alert-info">No pending courses to review.</div>
<div class="row" th:each="course : ${pendingCourses}">
    <div class="col-12 mb-4">
        <div class="card">
            <div class="card-header d-flex justify-content-between">
                <h5 class="mb-0" th:text="${course.title}"></h5>
                <span class="badge bg-warning text-dark">PENDING</span>
            </div>
            <div class="card-body">
                <p th:text="${course.description}"></p>
                <p class="text-muted small">Instructor: <strong th:text="${course.instructor.firstName + ' ' + course.instructor.lastName}"></strong></p>
                <p class="text-muted small">Submitted: <span th:text="${#temporals.format(course.createdAt, 'dd MMM yyyy')}"></span></p>
                <div class="row">
                    <div class="col-md-6">
                        <form th:action="@{'/moderator/courses/' + ${course.id} + '/approve'}" method="post">
                            <button type="submit" class="btn btn-success w-100">
                                <i class="bi bi-check-circle me-1"></i>Approve
                            </button>
                        </form>
                    </div>
                    <div class="col-md-6">
                        <form th:action="@{'/moderator/courses/' + ${course.id} + '/reject'}" method="post">
                            <div class="input-group">
                                <input type="text" name="note" class="form-control" placeholder="Rejection reason (optional)">
                                <button type="submit" class="btn btn-danger">
                                    <i class="bi bi-x-circle me-1"></i>Reject
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</th:block>
</body>
</html>

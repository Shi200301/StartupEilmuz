<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main-content})}">
<head><title>Admin Dashboard - Eilmuz</title></head>
<body>
<th:block th:fragment="main-content">
<h2 class="mb-4"><i class="bi bi-speedometer2 me-2"></i>Admin Dashboard</h2>
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5 class="card-title">Instructors</h5>
                <h2 th:text="${totalInstructors}">0</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5 class="card-title">Students</h5>
                <h2 th:text="${totalStudents}">0</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info">
            <div class="card-body">
                <h5 class="card-title">Approved Courses</h5>
                <h2 th:text="${totalApprovedCourses}">0</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <h5 class="card-title">Pending Courses</h5>
                <h2 th:text="${totalPendingCourses}">0</h2>
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-6">
        <h4>Instructors &amp; Course Counts</h4>
        <table class="table table-striped table-bordered">
            <thead class="table-dark"><tr><th>Instructor</th><th>Email</th><th>Courses</th></tr></thead>
            <tbody>
            <tr th:each="entry : ${instructorCourseCounts}">
                <td th:text="${entry.key.firstName + ' ' + entry.key.lastName}"></td>
                <td th:text="${entry.key.email}"></td>
                <td th:text="${entry.value}"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="col-md-6">
        <h4>Students &amp; Enrollments</h4>
        <table class="table table-striped table-bordered">
            <thead class="table-dark"><tr><th>Student</th><th>Email</th><th>Enrollments</th></tr></thead>
            <tbody>
            <tr th:each="entry : ${studentEnrollmentCounts}">
                <td th:text="${entry.key.firstName + ' ' + entry.key.lastName}"></td>
                <td th:text="${entry.key.email}"></td>
                <td th:text="${entry.value}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="row mt-4">
    <div class="col-12">
        <h4>Recent Moderator Actions</h4>
        <table class="table table-striped table-bordered">
            <thead class="table-dark"><tr><th>Moderator</th><th>Course</th><th>Action</th><th>Note</th><th>Time</th></tr></thead>
            <tbody>
            <tr th:each="action : ${recentActions}">
                <td th:text="${action.moderator.firstName + ' ' + action.moderator.lastName}"></td>
                <td th:text="${action.course.title}"></td>
                <td>
                    <span th:class="${action.action == 'APPROVED' ? 'badge bg-success' : 'badge bg-danger'}"
                          th:text="${action.action}"></span>
                </td>
                <td th:text="${action.note}"></td>
                <td th:text="${#temporals.format(action.actionAt, 'dd MMM yyyy HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</th:block>
</body>
</html>

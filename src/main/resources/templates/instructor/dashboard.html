<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::title}, ~{::main-content})}">
<head><title>Instructor Dashboard - Eilmuz</title></head>
<body>
<th:block th:fragment="main-content">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-easel me-2"></i>My Courses</h2>
    <a th:href="@{/instructor/courses/new}" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>New Course</a>
</div>
<div th:if="${param.created}" class="alert alert-success">Course created successfully! It's pending approval.</div>
<div th:if="${param.lessonAdded}" class="alert alert-success">Lesson added successfully!</div>
<div th:if="${#lists.isEmpty(courses)}" class="alert alert-info">You haven't created any courses yet.</div>
<div class="row" th:each="course : ${courses}">
    <div class="col-12 mb-3">
        <div class="card">
            <div class="row g-0">
                <div class="col-md-2" th:if="${course.thumbnailPath != null}">
                    <img th:src="@{'/uploads/' + ${course.thumbnailPath}}" class="img-fluid rounded-start" style="max-height:120px;object-fit:cover;" alt="thumbnail">
                </div>
                <div class="col">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h5 class="card-title" th:text="${course.title}"></h5>
                            <span th:class="${course.status.name() == 'APPROVED' ? 'badge bg-success' : course.status.name() == 'REJECTED' ? 'badge bg-danger' : 'badge bg-warning text-dark'}"
                                  th:text="${course.status}"></span>
                        </div>
                        <p class="card-text text-muted" th:text="${course.description}"></p>
                        <p class="text-danger small" th:if="${course.moderatorNote != null}" th:text="'Moderator note: ' + ${course.moderatorNote}"></p>
                        <a th:href="@{'/instructor/courses/' + ${course.id} + '/lessons/new'}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-plus me-1"></i>Add Lesson
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</th:block>
</body>
</html>
